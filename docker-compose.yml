services:
  db:
    image: postgres:16-alpine
    container_name: timetrak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timetrakpro
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./patch.sql:/docker-entrypoint-initdb.d/02-patch.sql:ro
      - ./patch2.sql:/docker-entrypoint-initdb.d/03-patch2.sql:ro
      - ./patch3.sql:/docker-entrypoint-initdb.d/04-patch3.sql:ro
      - ./patch4.sql:/docker-entrypoint-initdb.d/05-patch4.sql:ro
      - ./patch5.sql:/docker-entrypoint-initdb.d/06-patch5.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timetrakpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: timetrak-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: timetrakpro
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: super_secret_jwt_key_timesheet_2024
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_timesheet_2024
      JWT_EXPIRE: 1d
      JWT_REFRESH_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: timetrak-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
